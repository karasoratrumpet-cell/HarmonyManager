<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HarmoniX — 音楽ツール v1.1</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Noto+Sans+JP:wght@300;400;700&family=Space+Mono:wght@400;700&display=swap');

:root {
  --bg: #0a0a0f;
  --panel: #12121a;
  --panel2: #1a1a26;
  --border: #2a2a3e;
  --accent: #e8c547;
  --accent2: #47b8e8;
  --accent3: #e84778;
  --text: #e8e8f0;
  --text-dim: #6a6a8a;
  --white-key: #f0ede5;
  --black-key: #1a1820;
}

* { margin:0; padding:0; box-sizing:border-box; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Noto Sans JP', sans-serif;
  min-height: 100vh;
  overflow-x: hidden;
}

body::before {
  content:'';
  position:fixed; inset:0;
  background-image:
    linear-gradient(rgba(232,197,71,0.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(232,197,71,0.03) 1px, transparent 1px);
  background-size: 40px 40px;
  pointer-events:none;
  z-index:0;
}

.app {
  position:relative; z-index:1;
  max-width: 1200px;
  width: 100%;
  margin: 0 auto;
  padding: 24px 16px;
  transition: all 0.2s ease;
}

h1 {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 3rem;
  letter-spacing: 0.15em;
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  line-height:1;
  display: flex;
  align-items: baseline;
  gap: 12px;
}

.version {
  font-family: 'Space Mono', monospace;
  font-size: 1.2rem;
  color: var(--text-dim);
  letter-spacing: 0.05em;
  -webkit-text-fill-color: var(--text-dim);
}

.subtitle {
  font-size: 0.75rem;
  color: var(--text-dim);
  letter-spacing: 0.3em;
  text-transform: uppercase;
  margin-top: 4px;
  font-family: 'Space Mono', monospace;
}

header {
  display: flex;
  flex-wrap: wrap;
  align-items: flex-start;
  gap: 12px;
  margin-bottom: 28px;
  padding-bottom: 20px;
  border-bottom: 1px solid var(--border);
}

.tab-bar {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  width: 100%;
  order: 2;
}

.tab {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;
  width: 72px;
  height: 64px;
  border-radius: 10px;
  border: 1px solid var(--border);
  background: var(--panel);
  color: var(--text-dim);
  cursor: pointer;
  transition: all 0.18s;
  -webkit-tap-highlight-color: transparent;
  padding: 0;
}
.tab svg { display:block; transition: stroke 0.18s, fill 0.18s; }
.tab-label {
  font-family: 'Space Mono', monospace;
  font-size: 0.52rem;
  letter-spacing: 0.06em;
  line-height: 1;
  color: inherit;
}
.tab:hover { border-color: var(--accent); color: var(--accent); }
.tab.active {
  background: var(--accent);
  border-color: var(--accent);
  color: var(--bg);
}
.tab.active svg { stroke: var(--bg) !important; }
.tab.active .tab-icon-metro rect,
.tab.active .tab-icon-metro polygon { fill: var(--bg) !important; stroke: var(--bg) !important; }

.panel { display:none; }
.panel.active { display:block; }

/* ── CONTROLS ── */
.hd-controls {
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
  margin-bottom: 20px;
}

.ctrl-group {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 12px 16px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  flex: 1;
  min-width: 160px;
}
.ctrl-label {
  font-size: 0.63rem;
  letter-spacing: 0.22em;
  color: var(--text-dim);
  text-transform: uppercase;
  font-family: 'Space Mono', monospace;
}
.toggle-row { display:flex; gap:6px; }
.toggle-btn {
  flex:1;
  padding: 6px 0;
  border: 1px solid var(--border);
  background: transparent;
  color: var(--text-dim);
  border-radius: 4px;
  cursor: pointer;
  font-size: 0.73rem;
  font-family: 'Space Mono', monospace;
  transition: all 0.15s;
}
.toggle-btn:hover { border-color: var(--accent2); color: var(--accent2); }
.toggle-btn.active { background: var(--accent2); border-color: var(--accent2); color: var(--bg); font-weight:700; }

/* ── CHORD DISPLAY ── */
.chord-display {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 0 20px;
  margin-bottom: 20px;
  display: flex;
  align-items: center;
  gap: 16px;
  height: 88px;
  min-height: 88px;
  max-height: 88px;
  overflow: hidden;
  flex-shrink: 0;
  box-sizing: border-box;
}

.chord-name {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 3.6rem;
  line-height: 1;
  color: var(--accent);
  width: 160px;
  min-width: 160px;
  max-width: 160px;
  height: 58px;
  min-height: 58px;
  max-height: 58px;
  overflow: hidden;
  white-space: nowrap;
  text-overflow: clip;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  text-shadow: 0 0 32px rgba(232,197,71,0.3);
}
.chord-name.no-chord { color: var(--border); }

.chord-info {
  flex: 1;
  min-width: 0;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 5px;
  height: 88px;
}

.chord-type {
  font-size: 0.78rem;
  color: var(--text-dim);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  line-height: 1.2;
  flex-shrink: 0;
}

.active-notes {
  display: flex;
  gap: 5px;
  flex-wrap: nowrap;
  overflow: hidden;
  flex-shrink: 0;
  align-items: center;
}
.note-pill {
  padding: 2px 8px;
  border-radius: 99px;
  background: rgba(71,184,232,0.12);
  border: 1px solid var(--accent2);
  color: var(--accent2);
  font-family: 'Space Mono', monospace;
  font-size: 0.68rem;
  white-space: nowrap;
  flex-shrink: 0;
  line-height: 1.4;
}

.tuning-badge {
  padding: 4px 10px;
  border-radius: 4px;
  background: rgba(232,197,71,0.1);
  border: 1px solid rgba(232,197,71,0.3);
  color: var(--accent);
  font-family: 'Space Mono', monospace;
  font-size: 0.62rem;
  letter-spacing: 0.08em;
  white-space: nowrap;
  flex-shrink: 0;
  align-self: center;
}

/* ── OCTAVE NAV BAR ── */
.octave-nav {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 8px;
}
.oct-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 4px;
  padding: 0 18px;
  height: 44px;
  border: 1px solid var(--border);
  background: var(--panel);
  color: var(--text);
  border-radius: 8px;
  cursor: pointer;
  font-family: 'Space Mono', monospace;
  font-size: 0.8rem;
  font-weight: 700;
  white-space: nowrap;
  flex-shrink: 0;
  transition: background 0.15s, border-color 0.15s, color 0.15s;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
}
.oct-btn:active { background: var(--panel2); }
.oct-btn:disabled { opacity: 0.3; cursor: default; }
.oct-btn.prev { border-color: var(--accent2); color: var(--accent2); }
.oct-btn.next { border-color: var(--accent2); color: var(--accent2); }

.oct-range-label {
  flex: 1;
  text-align: center;
  font-family: 'Space Mono', monospace;
  font-size: 0.72rem;
  color: var(--text-dim);
  letter-spacing: 0.12em;
  line-height: 1.4;
}
.oct-range-label span {
  display: block;
  font-size: 0.58rem;
  color: var(--text-dim);
  opacity: 0.7;
  margin-top: 2px;
}

/* ── KEYBOARD ── */
.keyboard-wrap {
  overflow-x: auto;
  overflow-y: hidden;
  height: 210px;
  padding-bottom: 12px;
  scrollbar-width: thin;
  scrollbar-color: var(--border) transparent;
}
.keyboard-wrap::-webkit-scrollbar { height: 6px; }
.keyboard-wrap::-webkit-scrollbar-thumb { background: var(--border); border-radius:3px; }

.keyboard {
  position: relative;
  height: 192px;
  user-select: none;
}

.key.white {
  position: absolute;
  top: 0;
  width: 44px;
  height: 192px;
  background: var(--white-key);
  border-left: 1px solid #c8b898;
  border-right: 1px solid #b0a080;
  border-bottom: 1px solid #a09070;
  border-radius: 0 0 6px 6px;
  z-index: 1;
  cursor: pointer;
  box-shadow: inset -1px 0 0 rgba(255,255,255,0.4), 0 4px 8px rgba(0,0,0,0.3);
}
.key.white:hover   { background: #fffdf5; }
.key.white.pressed { background: #ffe066; box-shadow: inset 0 6px 10px rgba(0,0,0,0.12); }

.key.black {
  position: absolute;
  top: 0;
  width: 28px;
  height: 120px;
  background: var(--black-key);
  border-left: 1px solid #0a0810;
  border-right: 1px solid #0a0810;
  border-bottom: 2px solid #1a1428;
  border-radius: 0 0 4px 4px;
  z-index: 2;
  cursor: pointer;
  box-shadow: 2px 6px 14px rgba(0,0,0,0.75), inset 1px 0 0 rgba(255,255,255,0.04);
}
.key.black:hover   { background: #252030; }
.key.black.pressed { background: #e8c547; box-shadow: 0 0 10px rgba(232,197,71,0.5); }

.key-label {
  position: absolute;
  bottom: 8px;
  left: 50%;
  transform: translateX(-50%);
  font-size: 0.54rem;
  font-family: 'Space Mono', monospace;
  color: #9a8a70;
  pointer-events: none;
  white-space: nowrap;
}

/* ── METRONOME & TUNER ── */
.metro-layout { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
@media(max-width:700px){ .metro-layout{grid-template-columns:1fr;} }
.metro-panel { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 24px; }
.metro-display { text-align:center; margin-bottom:16px; }
.bpm-number { font-family: 'Bebas Neue', sans-serif; font-size: 7rem; line-height:1; color: var(--accent); text-shadow: 0 0 60px rgba(232,197,71,0.3); transition: color 0.1s; }
.bpm-unit { font-size:0.72rem; color:var(--text-dim); letter-spacing:0.3em; font-family:'Space Mono',monospace; }
.bpm-slider { width:100%; -webkit-appearance:none; height:4px; border-radius:2px; background:var(--border); outline:none; margin:14px 0; }
.bpm-slider::-webkit-slider-thumb { -webkit-appearance:none; width:20px; height:20px; border-radius:50%; background:var(--accent); cursor:pointer; box-shadow:0 0 8px rgba(232,197,71,0.5); }
.metro-btn { width:100%; padding:13px; border-radius:8px; border:none; font-family:'Bebas Neue',sans-serif; font-size:1.4rem; letter-spacing:0.15em; cursor:pointer; transition:all 0.15s; }
.metro-btn.start { background:var(--accent); color:var(--bg); }
.metro-btn.start.running { background:var(--accent3); box-shadow:0 0 20px rgba(232,71,120,0.4); }
.metro-btn.tap { background:transparent; border:1px solid var(--accent2); color:var(--accent2); margin-top:10px; }

.beat-visualizer { display:flex; gap:6px; justify-content:center; margin:14px 0; flex-wrap:wrap; min-height:20px; }
.beat-dot { width:11px; height:11px; border-radius:50%; background:var(--border); }
.beat-dot.beat-main { width:15px; height:15px; }
.beat-dot.lit-main { background:var(--accent); box-shadow:0 0 10px var(--accent); }
.beat-dot.lit-sub  { background:var(--accent2); box-shadow:0 0 7px var(--accent2); }

.pendulum-wrap { display:flex; justify-content:center; margin:6px 0; }
.pendulum-track { position:relative; width:130px; height:10px; background:var(--border); border-radius:5px; }
.pendulum-ball { position:absolute; top:50%; transform:translate(-50%,-50%); width:20px; height:20px; border-radius:50%; background:var(--accent); box-shadow:0 0 14px var(--accent); left: 10%; }

.volume-row { display:flex; align-items:center; gap:10px; margin-top:14px; }
.vol-label { font-size:0.63rem; color:var(--text-dim); font-family:'Space Mono',monospace; min-width:36px; }
.vol-slider { flex:1; -webkit-appearance:none; height:3px; border-radius:2px; background:var(--border); outline:none; }
.vol-slider::-webkit-slider-thumb { -webkit-appearance:none; width:14px; height:14px; border-radius:50%; background:var(--accent2); cursor:pointer; }

.sub-ctrl { margin-top:16px; }
.sub-label, .section-title { font-size:0.63rem; letter-spacing:0.2em; color:var(--text-dim); font-family:'Space Mono',monospace; text-transform:uppercase; margin-bottom:8px; }
.sub-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:6px; }
.sub-btn { padding:8px 6px; border:1px solid var(--border); background:transparent; color:var(--text-dim); border-radius:6px; cursor:pointer; font-family:'Space Mono',monospace; font-size:0.68rem; transition:all 0.15s; line-height:1.4; }
.sub-btn.active { background:rgba(232,71,120,0.15); border-color:var(--accent3); color:var(--accent3); }
.time-sig-grid { display:flex; gap:6px; flex-wrap:wrap; margin-top:8px; }
.tsig-btn { padding:6px 12px; border:1px solid var(--border); background:transparent; color:var(--text-dim); border-radius:4px; cursor:pointer; font-family:'Space Mono',monospace; font-size:0.73rem; }
.tsig-btn.active { background:rgba(232,197,71,0.15); border-color:var(--accent); color:var(--accent); }

/* Tuner Styles */
.tuner-layout { display: flex; flex-direction: column; gap: 16px; max-width: 520px; margin: 0 auto; }
.a-ref-row { display: flex; align-items: center; gap: 10px; background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 14px 18px; }
.a-ref-label { font-family: 'Space Mono', monospace; font-size: 0.72rem; color: var(--text-dim); white-space: nowrap; }
.tuner-note-panel { background: var(--panel); border: 1px solid var(--border); border-radius: 14px; padding: 28px 20px 20px; text-align: center; }
.tuner-note-name { font-family: 'Bebas Neue', sans-serif; font-size: 6rem; line-height: 1; color: var(--accent); text-shadow: 0 0 40px rgba(232,197,71,0.3); transition: color 0.2s; min-height: 6rem; }
.tuner-note-name.in-tune  { color: #44e87a; text-shadow: 0 0 30px rgba(68,232,122,0.4); }
.tuner-note-name.no-input { color: var(--border); }
.tuner-freq-display { font-family: 'Space Mono', monospace; font-size: 1rem; color: var(--text-dim); margin-top: 4px; min-height: 1.5rem; }
.cent-meter-wrap { margin: 20px auto 0; position: relative; width: 100%; max-width: 400px; }
.cent-track { position: relative; height: 14px; background: var(--panel2); border: 1px solid var(--border); border-radius: 7px; overflow: hidden; }
.cent-fill { position: absolute; top: 0; bottom: 0; width: 4px; border-radius: 2px; background: var(--accent); left: 50%; transform: translateX(-50%); transition: left 0.08s ease-out, background 0.15s; }
.cent-fill.in-tune  { background: #44e87a; box-shadow: 0 0 8px rgba(68,232,122,0.6); }
.cent-fill.flat     { background: var(--accent2); }
.cent-fill.sharp    { background: var(--accent3); }
.cent-center-line { position: absolute; top: -3px; bottom: -3px; left: 50%; width: 2px; background: rgba(255,255,255,0.25); transform: translateX(-50%); pointer-events: none; }
.cent-labels { display: flex; justify-content: space-between; margin-top: 5px; font-family: 'Space Mono', monospace; font-size: 0.58rem; color: var(--text-dim); padding: 0 2px; }
.cent-value { text-align: center; font-family: 'Space Mono', monospace; font-size: 1.1rem; font-weight: 700; margin-top: 10px; min-height: 1.6rem; transition: color 0.15s; }
.cent-value.in-tune { color: #44e87a; }
.tuner-mic-btn { width: 100%; padding: 13px; border-radius: 8px; border: 1px solid var(--accent2); background: transparent; color: var(--accent2); font-family: 'Bebas Neue', sans-serif; font-size: 1.3rem; letter-spacing: 0.15em; cursor: pointer; transition: all 0.15s; display: flex; align-items: center; justify-content: center; gap: 8px; }
.tuner-mic-btn.active { background: rgba(232,71,120,0.15); border-color: var(--accent3); color: var(--accent3); }
.tuner-hint { font-size: 0.68rem; color: var(--text-dim); text-align: center; line-height: 1.7; font-family: 'Space Mono', monospace; }
.a-spin-btn { width: 44px; height: 44px; border: 1px solid var(--accent); background: transparent; color: var(--accent); font-size: 1.3rem; line-height: 1; cursor: pointer; border-radius: 6px; font-family: 'Space Mono', monospace; flex-shrink: 0; }
.a-spin-display { min-width: 64px; text-align: center; font-family: 'Bebas Neue', sans-serif; font-size: 2rem; color: var(--accent); line-height: 44px; border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); padding: 0 8px; }

/* スマホ等コンパクト画面用 */
body.compact-layout .app { padding: 10px 12px; }
body.compact-layout header { margin-bottom: 12px; padding-bottom: 8px; }
body.compact-layout h1 { font-size: 2.2rem; }
body.compact-layout .tab { height: 52px; width: 66px; }
body.compact-layout .hd-controls { margin-bottom: 12px; gap: 8px; }
body.compact-layout .ctrl-group { padding: 8px 12px; min-width: 140px; gap: 4px; }
body.compact-layout .chord-display { height: 72px; min-height: 72px; max-height: 72px; margin-bottom: 12px; padding: 0 14px; }
body.compact-layout .chord-name { font-size: 2.8rem; width: 130px; min-width: 130px; max-width: 130px; height: 46px; min-height: 46px; max-height: 46px; }
body.compact-layout .keyboard-wrap { height: 175px; padding-bottom: 6px; }
body.compact-layout .keyboard { height: 160px; }
body.compact-layout .key.white { height: 160px; width: 38px; }
body.compact-layout .key.black { height: 100px; width: 24px; }
</style>
</head>
<body>
<div class="app">
  <header>
    <div>
      <h1>HarmoniX <span class="version">v1.1</span></h1>
      <div class="subtitle">音楽ツール // Music Tool</div>
    </div>
    <div class="tab-bar">
      <button class="tab active" onclick="switchTab('harmony',this)" aria-label="ハーモニー">
        <svg width="32" height="22" viewBox="0 0 32 22" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><rect x="1" y="1" width="4" height="20" rx="1"/><rect x="6" y="1" width="4" height="20" rx="1"/><rect x="11" y="1" width="4" height="20" rx="1"/><rect x="16" y="1" width="4" height="20" rx="1"/><rect x="21" y="1" width="4" height="20" rx="1"/><rect x="26" y="1" width="4" height="20" rx="1"/><rect x="4" y="1" width="3" height="12" rx="1" fill="currentColor" stroke="none"/><rect x="9" y="1" width="3" height="12" rx="1" fill="currentColor" stroke="none"/><rect x="19" y="1" width="3" height="12" rx="1" fill="currentColor" stroke="none"/><rect x="24" y="1" width="3" height="12" rx="1" fill="currentColor" stroke="none"/></svg>
        <span class="tab-label">ハーモニー</span>
      </button>
      <button class="tab" onclick="switchTab('metro',this)" aria-label="メトロノーム">
        <svg class="tab-icon-metro" width="26" height="28" viewBox="0 0 26 28" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><polygon points="5,27 21,27 18,4 8,4"/><line x1="13" y1="22" x2="18" y2="8"/><circle cx="18.5" cy="7.5" r="2" fill="currentColor" stroke="none"/><line x1="3" y1="27" x2="23" y2="27"/><line x1="13" y1="22" x2="13" y2="25"/></svg>
        <span class="tab-label">メトロノーム</span>
      </button>
      <button class="tab" onclick="switchTab('tuner',this)" aria-label="チューナー">
        <svg width="24" height="28" viewBox="0 0 24 28" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><line x1="9" y1="4" x2="9" y2="18"/><line x1="15" y1="4" x2="15" y2="18"/><path d="M9,4 Q9,1 12,1 Q15,1 15,4"/><line x1="12" y1="18" x2="12" y2="27"/><line x1="9.5" y1="23" x2="14.5" y2="23"/></svg>
        <span class="tab-label">チューナー</span>
      </button>
    </div>
  </header>

  <div id="panel-harmony" class="panel active">
    <div class="hd-controls">
      <div class="ctrl-group">
        <div class="ctrl-label">チューニング</div>
        <div class="toggle-row">
          <button class="toggle-btn active" id="btn-equal" onclick="setTuning('equal')">平均律</button>
          <button class="toggle-btn" id="btn-just" onclick="setTuning('just')">純正律</button>
        </div>
        <div class="toggle-row" id="autoroot-row" style="margin-top:4px; display:none;">
          <button class="toggle-btn active" id="btn-autoroot-on" onclick="setAutoRoot(true)">根音自動: ON</button>
          <button class="toggle-btn" id="btn-autoroot-off" onclick="setAutoRoot(false)">OFF (C固定)</button>
        </div>
      </div>
      <div class="ctrl-group">
        <div class="ctrl-label">音色</div>
        <div class="toggle-row">
          <button class="toggle-btn active" id="btn-sine" onclick="setTimbre('sine')">シンプル</button>
          <button class="toggle-btn" id="btn-wind" onclick="setTimbre('wind')">管楽器</button>
        </div>
      </div>
      <div class="ctrl-group">
        <div class="ctrl-label">音量</div>
        <input type="range" class="vol-slider" min="0" max="1" step="0.01" value="0.5" oninput="setVolume(this.value)" style="margin-top:6px;">
      </div>
      <div class="ctrl-group" style="min-width:100%;flex-basis:100%;">
        <div class="ctrl-label">基準音 A =</div>
        <div style="display:flex;align-items:center;gap:0;margin-top:4px;">
          <button class="a-spin-btn" onclick="setA4(tunerA4-1)">−</button>
          <div class="a-spin-display" id="a4-display-harmony">442</div>
          <button class="a-spin-btn" onclick="setA4(tunerA4+1)">＋</button>
          <span style="font-family:'Space Mono';font-size:0.7rem;color:var(--text-dim);margin-left:8px;">Hz</span>
        </div>
      </div>
    </div>

    <div class="chord-display">
      <div class="chord-name no-chord" id="chord-name">—</div>
      <div class="chord-info">
        <div class="chord-type" id="chord-type">鍵盤を押してください</div>
        <div class="active-notes" id="active-notes-display"></div>
      </div>
      <div class="tuning-badge" id="tuning-badge">平均律</div>
    </div>

    <div class="octave-nav">
      <button class="oct-btn prev" id="oct-prev" onclick="shiftOctave(-1)">◀ 1oct下</button>
      <div class="oct-range-label" id="oct-range-label">C3 〜 B5<span>表示中の音域</span></div>
      <button class="oct-btn next" id="oct-next" onclick="shiftOctave(+1)">1oct上 ▶</button>
    </div>
    <div class="keyboard-wrap"><div class="keyboard" id="keyboard"></div></div>
    <div style="margin-top:8px;font-size:0.6rem;color:var(--text-dim);font-family:'Space Mono';text-align:center;">PC キー: A S D F G H J K L (白) / W E T Y U O P (黒) — C4 基準</div>
  </div>

  <div id="panel-metro" class="panel">
    <div class="metro-layout">
      <div class="metro-panel">
        <div class="metro-display">
          <div class="bpm-number" id="bpm-display">120</div><div class="bpm-unit">BPM</div>
        </div>
        <div class="pendulum-wrap"><div class="pendulum-track"><div class="pendulum-ball" id="pendulum-ball"></div></div></div>
        <input type="range" class="bpm-slider" id="bpm-slider" min="40" max="240" value="120" oninput="setBPM(parseInt(this.value))">
        <div class="beat-visualizer" id="beat-viz"></div>
        <button class="metro-btn start" id="metro-start" onclick="toggleMetro()">▶ スタート</button>
        <button class="metro-btn tap" onclick="tapTempo()">TAP TEMPO</button>
        <div class="volume-row"><div class="vol-label">強拍</div><input type="range" class="vol-slider" min="0" max="1" step="0.01" value="0.7" oninput="setMetroVol(this.value)"></div>
        <div class="volume-row"><div class="vol-label">弱拍</div><input type="range" class="vol-slider" min="0" max="1" step="0.01" value="0.7" oninput="setSubVol(this.value)"></div>
      </div>
      <div class="metro-panel">
        <div class="section-title">拍子</div>
        <div class="time-sig-grid">
          <button class="tsig-btn active" onclick="setTimeSig(4,this)">4/4</button>
          <button class="tsig-btn" onclick="setTimeSig(3,this)">3/4</button>
          <button class="tsig-btn" onclick="setTimeSig(2,this)">2/4</button>
          <button class="tsig-btn" onclick="setTimeSig(6,this)">6/8</button>
          <button class="tsig-btn" onclick="setTimeSig(1,this)">拍子なし</button>
        </div>
        <div class="sub-ctrl" style="margin-top:20px;">
          <div class="sub-label">裏拍 / サブディビジョン</div>
          <div class="sub-grid">
            <button class="sub-btn active" onclick="setSubDiv('none',this)">なし</button>
            <button class="sub-btn" onclick="setSubDiv('8th',this)">8分音符</button>
            <button class="sub-btn" onclick="setSubDiv('16th',this)">16分音符</button>
            <button class="sub-btn" onclick="setSubDiv('triplet',this)">3連符</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div id="panel-tuner" class="panel">
    <div class="tuner-layout">
      <div class="a-ref-row">
        <div class="a-ref-label">基準音 A =</div>
        <div style="display:flex;align-items:center;flex:1;justify-content:center;">
          <button class="a-spin-btn" onclick="setA4(tunerA4-1)">−</button>
          <div class="a-spin-display" id="a4-display">442</div>
          <button class="a-spin-btn" onclick="setA4(tunerA4+1)">＋</button>
          <span style="font-family:'Space Mono';font-size:0.7rem;color:var(--text-dim);margin-left:8px;">Hz</span>
        </div>
      </div>
      <div class="tuner-note-panel">
        <div class="tuner-note-name no-input" id="tuner-note">—</div>
        <div class="tuner-freq-display" id="tuner-freq"></div>
        <div class="cent-meter-wrap">
          <div class="cent-track"><div class="cent-center-line"></div><div class="cent-fill" id="cent-fill"></div></div>
          <div class="cent-labels"><span>−50¢</span><span>−25¢</span><span>0</span><span>+25¢</span><span>+50¢</span></div>
          <div class="cent-value" id="cent-value"></div>
        </div>
      </div>
      <button class="tuner-mic-btn" id="tuner-mic-btn" onclick="toggleTuner()">マイクをオンにする</button>
    </div>
  </div>
</div>

<script>
'use strict';
// ═══════════════════════════════════════════════════
// AUDIO CONTEXT & CORE
// ═══════════════════════════════════════════════════
const AC = new (window.AudioContext || window.webkitAudioContext)();
const masterGain = AC.createGain(); masterGain.gain.value = 0.5; masterGain.connect(AC.destination);
const metroGain  = AC.createGain(); metroGain.gain.value  = 0.7; metroGain.connect(AC.destination);
const subGain    = AC.createGain(); subGain.gain.value    = 0.7; subGain.connect(AC.destination);

function setVolume(v)   { masterGain.gain.value = parseFloat(v); }
function setMetroVol(v) { metroGain.gain.value  = parseFloat(v); }
function setSubVol(v)   { subGain.gain.value    = parseFloat(v); }

let tuning = 'equal';
let timbre = 'sine';
let A4_FREQ = 442;
let autoRoot = true;

const JUST = [1, 16/15, 9/8, 6/5, 5/4, 4/3, 45/32, 3/2, 8/5, 5/3, 9/5, 15/8];
const activeOscs = {};
const pressedNotes = new Set();

function playNote(semitone) {
  if (activeOscs[semitone]) return;
  AC.resume();
  
  const gainNode = AC.createGain();
  gainNode.gain.setValueAtTime(0, AC.currentTime);
  gainNode.gain.linearRampToValueAtTime(0.22, AC.currentTime + 0.015);
  gainNode.connect(masterGain);

  const oscList = [];
  if (timbre === 'sine') {
    const o1 = AC.createOscillator(); o1.type = 'sine';
    const o2 = AC.createOscillator(); o2.type = 'sine';
    const g2 = AC.createGain(); g2.gain.value = 0.1;
    o1.connect(gainNode); o2.connect(g2); g2.connect(gainNode);
    o1.start(); o2.start();
    oscList.push({ osc: o1, mult: 1 }, { osc: o2, mult: 2 });
  } else {
    [1,3,5,7].forEach((h,i) => {
      const o = AC.createOscillator(); o.type = 'sine';
      const g = AC.createGain(); g.gain.value = [0.55,0.35,0.12,0.04][i];
      o.connect(g); g.connect(gainNode); o.start();
      oscList.push({ osc: o, mult: h });
    });
  }

  activeOscs[semitone] = { oscList, gainNode };
  tuneActiveNotes();
}

function stopNote(semitone) {
  if (!activeOscs[semitone]) return;
  const { oscList, gainNode } = activeOscs[semitone];
  const t = AC.currentTime;
  gainNode.gain.cancelScheduledValues(t);
  gainNode.gain.setValueAtTime(gainNode.gain.value, t);
  gainNode.gain.exponentialRampToValueAtTime(0.001, t + 0.1); 
  oscList.forEach(item => { try { item.osc.stop(t + 0.15); } catch(e){} });
  delete activeOscs[semitone];
  
  setTimeout(() => { if(Object.keys(activeOscs).length > 0) tuneActiveNotes(); }, 10);
}

function tuneActiveNotes() {
  const pressed = [...pressedNotes].sort((a,b)=>a-b);
  let rootSemitone = pressed.length > 0 ? pressed[0] : null;

  if (pressed.length > 0 && autoRoot && tuning === 'just') {
    const pcs = [...new Set(pressed.map(s => ((s%12)+12)%12))].sort((a,b)=>a-b);
    let best = null;
    for (const root of pcs) {
      const ivs = pcs.map(n => ((n-root)+12)%12).sort((a,b)=>a-b);
      for (const ct of CHORD_TYPES) {
        const ci = ct.iv.map(i=>i%12).sort((a,b)=>a-b);
        if (ivs.length===ci.length && ivs.every((v,i)=>v===ci[i])) { best={root,ct}; break; }
      }
      if (best) break;
    }
    if (best) {
      const found = pressed.find(s => ((s%12)+12)%12 === best.root);
      if (found !== undefined) rootSemitone = found;
    }
  }

  const t = AC.currentTime;
  const rootEqualFreq = rootSemitone !== null ? (A4_FREQ * Math.pow(2, (rootSemitone - 9) / 12)) : A4_FREQ;

  for (const semitone in activeOscs) {
    const s = parseInt(semitone);
    let freq;
    if (tuning === 'equal' || rootSemitone === null || !autoRoot) {
      freq = A4_FREQ * Math.pow(2, (s - 9) / 12);
    } else {
      const diff = s - rootSemitone;
      const octShift = Math.floor(diff / 12);
      const degree = ((diff % 12) + 12) % 12;
      freq = rootEqualFreq * Math.pow(2, octShift) * JUST[degree];
    }
    activeOscs[semitone].oscList.forEach(item => {
      item.osc.frequency.setTargetAtTime(freq * item.mult, t, 0.02);
    });
  }
}

function startNote(s) {
  if (pressedNotes.has(s)) return;
  pressedNotes.add(s);
  playNote(s);
  document.querySelectorAll(`.key[data-semitone="${s}"]`).forEach(k => k.classList.add('pressed'));
  updateChord();
}

function endNote(s) {
  if (!pressedNotes.has(s)) return;
  pressedNotes.delete(s);
  stopNote(s);
  document.querySelectorAll(`.key[data-semitone="${s}"]`).forEach(k => k.classList.remove('pressed'));
  updateChord();
}

const CHORD_TYPES = [
  {name:'',iv:[0,4,7],label:'メジャー'}, {name:'m',iv:[0,3,7],label:'マイナー'},
  {name:'7',iv:[0,4,7,10],label:'ドミナント7th'}, {name:'M7',iv:[0,4,7,11],label:'メジャー7th'},
  {name:'m7',iv:[0,3,7,10],label:'マイナー7th'}, {name:'dim',iv:[0,3,6],label:'ディミニッシュ'},
  {name:'sus4',iv:[0,5,7],label:'サスフォー'}
];
const NOTE_NAMES = ['C','D♭','D','E♭','E','F','G♭','G','A♭','A','B♭','B'];
const WHITE_DEG = [0,2,4,5,7,9,11];
const BLACK_AFTER = [1,3,null,6,8,10,null];

let OCT_SPAN = 3, octLo = 3;
const OCT_MIN = 1, OCT_MAX = 7, KW = 44, KG = 2, KB_W = 28;

function octHi() { return octLo + OCT_SPAN - 1; }
function shiftOctave(delta) {
  const newLo = octLo + delta;
  if (newLo < OCT_MIN || newLo + OCT_SPAN - 1 > OCT_MAX) return;
  [...pressedNotes].forEach(s => endNote(s));
  octLo = newLo; buildKeyboard(); updateOctaveNav();
}
function updateOctaveNav() {
  document.getElementById('oct-range-label').innerHTML = `C${octLo} 〜 B${octHi()}<span>表示中の音域</span>`;
  document.getElementById('oct-prev').disabled = (octLo <= OCT_MIN);
  document.getElementById('oct-next').disabled = (octHi() >= OCT_MAX);
}
function buildKeyboard() {
  const kb = document.getElementById('keyboard');
  if (!kb) return;
  kb.innerHTML = '';
  let wi = 0;
  for (let oct = octLo; oct <= octHi(); oct++) {
    for (let pos = 0; pos < WHITE_DEG.length; pos++) {
      const degree = WHITE_DEG[pos], semitone = (oct - 4) * 12 + degree;
      const wk = document.createElement('div');
      wk.className = 'key white'; wk.dataset.semitone = semitone;
      wk.style.left = (wi * (KW + KG)) + 'px';
      if (degree === 0) { const lbl = document.createElement('div'); lbl.className = 'key-label'; lbl.textContent = 'C' + oct; wk.appendChild(lbl); }
      addKeyEvents(wk, semitone); kb.appendChild(wk);
      const bd = BLACK_AFTER[pos];
      if (bd !== null) {
        const bs = (oct - 4) * 12 + bd;
        const bk = document.createElement('div'); bk.className = 'key black'; bk.dataset.semitone = bs;
        bk.style.left = (wi * (KW + KG) + KW - KB_W / 2 + KG / 2) + 'px';
        addKeyEvents(bk, bs); kb.appendChild(bk);
      }
      wi++;
    }
  }
  kb.style.width = (wi * (KW + KG)) + 'px';
}
function addKeyEvents(el, semitone) {
  el.addEventListener('mousedown', e => { e.preventDefault(); startNote(semitone); });
  el.addEventListener('mouseup', ()=> endNote(semitone));
  el.addEventListener('mouseleave', ()=> { if (el.classList.contains('pressed')) endNote(semitone); });
  el.addEventListener('touchstart', e => { e.preventDefault(); startNote(semitone); }, {passive:false});
  el.addEventListener('touchend', e => { e.preventDefault(); endNote(semitone); });
}

function updateChord() {
  const nameEl = document.getElementById('chord-name');
  const typeEl = document.getElementById('chord-type');
  const notesEl = document.getElementById('active-notes-display');
  const pressed = [...pressedNotes].sort((a,b)=>a-b);
  
  notesEl.innerHTML = pressed.map(s => `<span class="note-pill">${NOTE_NAMES[((s%12)+12)%12]}${Math.floor(s/12) + 4}</span>`).join('');
  const pcs = [...new Set(pressed.map(s => ((s%12)+12)%12))].sort((a,b)=>a-b);

  if (pcs.length === 0) {
    nameEl.textContent = '—'; nameEl.className = 'chord-name no-chord';
    typeEl.textContent = '鍵盤を押してください'; return;
  }
  if (pcs.length === 1) {
    nameEl.textContent = NOTE_NAMES[pcs[0]]; nameEl.className = 'chord-name';
    typeEl.textContent = '単音'; return;
  }
  let best = null;
  for (const root of pcs) {
    const ivs = pcs.map(n => ((n-root)+12)%12).sort((a,b)=>a-b);
    for (const ct of CHORD_TYPES) {
      const ci = ct.iv.map(i=>i%12).sort((a,b)=>a-b);
      if (ivs.length===ci.length && ivs.every((v,i)=>v===ci[i])) { best={root,ct}; break; }
    }
    if (best) break;
  }
  if (best) {
    nameEl.textContent = NOTE_NAMES[best.root] + best.ct.name;
    nameEl.className = 'chord-name'; typeEl.textContent = best.ct.label;
  } else {
    nameEl.textContent = '?'; nameEl.className = 'chord-name'; typeEl.textContent = '不明なコード';
  }
}

function setTuning(t) {
  tuning = t;
  document.getElementById('btn-equal').classList.toggle('active', t==='equal');
  document.getElementById('btn-just').classList.toggle('active',  t==='just');
  document.getElementById('autoroot-row').style.display = (t === 'just') ? 'flex' : 'none';
  document.getElementById('tuning-badge').textContent = t==='equal' ? '平均律' : (autoRoot ? '純正律(自動)' : '純正律(C固定)');
  tuneActiveNotes();
}

function setAutoRoot(val) {
  autoRoot = val;
  document.getElementById('btn-autoroot-on').classList.toggle('active', val);
  document.getElementById('btn-autoroot-off').classList.toggle('active', !val);
  document.getElementById('tuning-badge').textContent = autoRoot ? '純正律(自動)' : '純正律(C固定)';
  tuneActiveNotes();
}

function setTimbre(t) {
  timbre = t;
  document.getElementById('btn-sine').classList.toggle('active', t==='sine');
  document.getElementById('btn-wind').classList.toggle('active', t==='wind');
  [...pressedNotes].forEach(s=>{stopNote(s);playNote(s);});
}

let tunerA4 = 442;
function setA4(hz) {
  tunerA4 = A4_FREQ = Math.max(415, Math.min(470, parseInt(hz)));
  if(document.getElementById('a4-display')) document.getElementById('a4-display').textContent = hz;
  if(document.getElementById('a4-display-harmony')) document.getElementById('a4-display-harmony').textContent = hz;
  tuneActiveNotes();
}

const KEY_MAP = {'a':0,'w':1,'s':2,'e':3,'d':4,'f':5,'t':6,'g':7,'y':8,'h':9,'u':10,'j':11,'k':12,'o':13,'l':14,'p':15,';':16};
const heldKeys = new Set();
document.addEventListener('keydown', e => {
  if (e.repeat || e.target.tagName==='INPUT') return;
  const k = e.key.toLowerCase();
  if (k in KEY_MAP && !heldKeys.has(k)) { heldKeys.add(k); startNote(KEY_MAP[k]); }
});
document.addEventListener('keyup', e => {
  const k = e.key.toLowerCase();
  if (k in KEY_MAP && heldKeys.has(k)) { heldKeys.delete(k); endNote(KEY_MAP[k]); }
});

function switchTab(name, el) {
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.getElementById('panel-'+name).classList.add('active');
  el.classList.add('active');
}

let isFirstLoad = true;
function adjustLayoutForDevice() {
  const width = window.innerWidth;
  const height = window.innerHeight;
  
  if (height < 740 || width < 500) {
    document.body.classList.add('compact-layout');
  } else {
    document.body.classList.remove('compact-layout');
  }

  let newSpan = 3;
  let forceRebuild = false;
  
  if (width < 520) {
    newSpan = 2;
    if (isFirstLoad) { octLo = 4; forceRebuild = true; }
  } else if (width > 1050) {
    newSpan = 4;
  }
  isFirstLoad = false;

  if (newSpan !== OCT_SPAN || forceRebuild) {
    OCT_SPAN = newSpan;
    if (octLo + OCT_SPAN - 1 > OCT_MAX) octLo = OCT_MAX - OCT_SPAN + 1;
    [...pressedNotes].forEach(s => endNote(s));
    buildKeyboard();
    updateOctaveNav();
  }
}

window.addEventListener('resize', adjustLayoutForDevice);
window.addEventListener('DOMContentLoaded', () => {
  adjustLayoutForDevice();
  setA4(442);
});
</script>
</body>
</html>

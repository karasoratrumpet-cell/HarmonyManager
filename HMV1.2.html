<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HarmoniX — 音楽ツール v1.2</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Noto+Sans+JP:wght@300;400;700&family=Space+Mono:wght@400;700&display=swap');

:root {
  --bg: #0a0a0f;
  --panel: #12121a;
  --panel2: #1a1a26;
  --border: #2a2a3e;
  --accent: #e8c547;
  --accent2: #47b8e8;
  --accent3: #e84778;
  --text: #e8e8f0;
  --text-dim: #6a6a8a;
  --white-key: #f0ede5;
  --black-key: #1a1820;
}

* { margin:0; padding:0; box-sizing:border-box; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Noto Sans JP', sans-serif;
  min-height: 100vh;
  overflow-x: hidden;
}

body::before {
  content:'';
  position:fixed; inset:0;
  background-image:
    linear-gradient(rgba(232,197,71,0.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(232,197,71,0.03) 1px, transparent 1px);
  background-size: 40px 40px;
  pointer-events:none;
  z-index:0;
}

.app {
  position:relative; z-index:1;
  max-width: 1200px;
  width: 100%;
  margin: 0 auto;
  padding: 16px;
  transition: all 0.2s ease;
}

/* ── HEADER & TAB BAR ── */
header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 16px;
  padding-bottom: 12px;
  border-bottom: 1px solid var(--border);
  flex-wrap: wrap;
}

.brand {
  display: flex;
  flex-direction: column;
}

h1 {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 2.6rem;
  letter-spacing: 0.12em;
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  line-height: 1;
  display: flex;
  align-items: baseline;
  gap: 8px;
}

.version {
  font-family: 'Space Mono', monospace;
  font-size: 1rem;
  color: var(--text-dim);
  letter-spacing: 0.05em;
  -webkit-text-fill-color: var(--text-dim);
}

.subtitle {
  font-size: 0.68rem;
  color: var(--text-dim);
  letter-spacing: 0.2em;
  text-transform: uppercase;
  margin-top: 2px;
  font-family: 'Space Mono', monospace;
}

.tab-bar {
  display: flex;
  gap: 6px;
  align-items: center;
}

.tab {
  display: flex;
  flex-direction: row;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 0 14px;
  height: 42px;
  border-radius: 8px;
  border: 1px solid var(--border);
  background: var(--panel);
  color: var(--text-dim);
  cursor: pointer;
  transition: all 0.18s;
  -webkit-tap-highlight-color: transparent;
}
.tab svg { display:block; transition: stroke 0.18s, fill 0.18s; }
.tab-label {
  font-family: 'Space Mono', monospace;
  font-size: 0.72rem;
  letter-spacing: 0.04em;
  line-height: 1;
  color: inherit;
  font-weight: 700;
}
.tab:hover { border-color: var(--accent); color: var(--accent); }
.tab.active {
  background: var(--accent);
  border-color: var(--accent);
  color: var(--bg);
}
.tab.active svg { stroke: var(--bg) !important; }
.tab.active .tab-icon-metro rect,
.tab.active .tab-icon-metro polygon { fill: var(--bg) !important; stroke: var(--bg) !important; }

.panel { display:none; }
.panel.active { display:block; }

/* ── CONTROLS ── */
.hd-controls {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin-bottom: 12px;
}

.ctrl-group {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 8px 12px;
  display: flex;
  flex-direction: column;
  gap: 6px;
  flex: 1;
  min-width: 140px;
}
.ctrl-label {
  font-size: 0.6rem;
  letter-spacing: 0.18em;
  color: var(--text-dim);
  text-transform: uppercase;
  font-family: 'Space Mono', monospace;
}
.toggle-row { display:flex; gap:4px; }
.toggle-btn {
  flex:1;
  padding: 5px 0;
  border: 1px solid var(--border);
  background: transparent;
  color: var(--text-dim);
  border-radius: 4px;
  cursor: pointer;
  font-size: 0.7rem;
  font-family: 'Space Mono', monospace;
  transition: all 0.15s;
}
.toggle-btn:hover { border-color: var(--accent2); color: var(--accent2); }
.toggle-btn.active { background: var(--accent2); border-color: var(--accent2); color: var(--bg); font-weight:700; }

/* ── CHORD DISPLAY ── */
.chord-display {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 0 16px;
  margin-bottom: 12px;
  display: flex;
  align-items: center;
  gap: 12px;
  height: 68px;
  min-height: 68px;
  max-height: 68px;
  overflow: hidden;
  flex-shrink: 0;
}

.chord-name {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 3rem;
  line-height: 1;
  color: var(--accent);
  width: 130px;
  min-width: 130px;
  max-width: 130px;
  height: 48px;
  overflow: hidden;
  white-space: nowrap;
  text-overflow: clip;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  text-shadow: 0 0 24px rgba(232,197,71,0.3);
}
.chord-name.no-chord { color: var(--border); }

.chord-info {
  flex: 1;
  min-width: 0;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 3px;
  height: 68px;
}

.chord-type {
  font-size: 0.72rem;
  color: var(--text-dim);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  line-height: 1.2;
}

.active-notes {
  display: flex;
  gap: 4px;
  flex-wrap: nowrap;
  overflow: hidden;
  align-items: center;
}
.note-pill {
  padding: 1px 6px;
  border-radius: 99px;
  background: rgba(71,184,232,0.12);
  border: 1px solid var(--accent2);
  color: var(--accent2);
  font-family: 'Space Mono', monospace;
  font-size: 0.62rem;
  white-space: nowrap;
}

.tuning-badge {
  padding: 3px 8px;
  border-radius: 4px;
  background: rgba(232,197,71,0.1);
  border: 1px solid rgba(232,197,71,0.3);
  color: var(--accent);
  font-family: 'Space Mono', monospace;
  font-size: 0.6rem;
  letter-spacing: 0.06em;
  white-space: nowrap;
  align-self: center;
}

/* ── OCTAVE NAV BAR ── */
.octave-nav {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-bottom: 6px;
}
.oct-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0 14px;
  height: 36px;
  border: 1px solid var(--border);
  background: var(--panel);
  color: var(--text);
  border-radius: 6px;
  cursor: pointer;
  font-family: 'Space Mono', monospace;
  font-size: 0.75rem;
  font-weight: 700;
  white-space: nowrap;
  transition: background 0.15s, border-color 0.15s, color 0.15s;
  user-select: none;
}
.oct-btn:active { background: var(--panel2); }
.oct-btn:disabled { opacity: 0.3; cursor: default; }
.oct-btn.prev, .oct-btn.next { border-color: var(--accent2); color: var(--accent2); }

.oct-range-label {
  flex: 1;
  text-align: center;
  font-family: 'Space Mono', monospace;
  font-size: 0.68rem;
  color: var(--text-dim);
  letter-spacing: 0.08em;
}

/* ── KEYBOARD ── */
.keyboard-wrap {
  overflow-x: auto;
  overflow-y: hidden;
  height: 175px;
  padding-bottom: 6px;
  scrollbar-width: thin;
  scrollbar-color: var(--border) transparent;
}
.keyboard-wrap::-webkit-scrollbar { height: 6px; }
.keyboard-wrap::-webkit-scrollbar-thumb { background: var(--border); border-radius:3px; }

.keyboard {
  position: relative;
  height: 160px;
  user-select: none;
}

.key.white {
  position: absolute;
  top: 0;
  width: 38px;
  height: 160px;
  background: var(--white-key);
  border-left: 1px solid #c8b898;
  border-right: 1px solid #b0a080;
  border-bottom: 1px solid #a09070;
  border-radius: 0 0 5px 5px;
  z-index: 1;
  cursor: pointer;
  box-shadow: inset -1px 0 0 rgba(255,255,255,0.4), 0 3px 6px rgba(0,0,0,0.3);
}
.key.white:hover   { background: #fffdf5; }
.key.white.pressed { background: #ffe066; box-shadow: inset 0 4px 8px rgba(0,0,0,0.12); }

.key.black {
  position: absolute;
  top: 0;
  width: 24px;
  height: 100px;
  background: var(--black-key);
  border-left: 1px solid #0a0810;
  border-right: 1px solid #0a0810;
  border-bottom: 2px solid #1a1428;
  border-radius: 0 0 4px 4px;
  z-index: 2;
  cursor: pointer;
  box-shadow: 2px 5px 10px rgba(0,0,0,0.75);
}
.key.black:hover   { background: #252030; }
.key.black.pressed { background: #e8c547; box-shadow: 0 0 10px rgba(232,197,71,0.5); }

.key-label {
  position: absolute;
  bottom: 6px;
  left: 50%;
  transform: translateX(-50%);
  font-size: 0.5rem;
  font-family: 'Space Mono', monospace;
  color: #9a8a70;
  pointer-events: none;
}

/* ── METRONOME & TUNER ── */
.metro-layout { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media(max-width:700px){ .metro-layout{grid-template-columns:1fr;} }
.metro-panel { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 18px; }
.metro-display { text-align:center; margin-bottom:12px; }
.bpm-number { font-family: 'Bebas Neue', sans-serif; font-size: 5.5rem; line-height:1; color: var(--accent); text-shadow: 0 0 40px rgba(232,197,71,0.3); }
.bpm-unit { font-size:0.65rem; color:var(--text-dim); letter-spacing:0.25em; font-family:'Space Mono',monospace; }
.bpm-slider { width:100%; -webkit-appearance:none; height:4px; border-radius:2px; background:var(--border); outline:none; margin:10px 0; }
.bpm-slider::-webkit-slider-thumb { -webkit-appearance:none; width:18px; height:18px; border-radius:50%; background:var(--accent); cursor:pointer; }
.metro-btn { width:100%; padding:10px; border-radius:6px; border:none; font-family:'Bebas Neue',sans-serif; font-size:1.2rem; letter-spacing:0.12em; cursor:pointer; }
.metro-btn.start { background:var(--accent); color:var(--bg); }
.metro-btn.start.running { background:var(--accent3); }
.metro-btn.tap { background:transparent; border:1px solid var(--accent2); color:var(--accent2); margin-top:8px; }

.sub-ctrl { margin-top:12px; }
.sub-label, .section-title { font-size:0.6rem; letter-spacing:0.18em; color:var(--text-dim); font-family:'Space Mono',monospace; text-transform:uppercase; margin-bottom:6px; }
.sub-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:6px; }
.sub-btn { padding:6px; border:1px solid var(--border); background:transparent; color:var(--text-dim); border-radius:4px; cursor:pointer; font-family:'Space Mono',monospace; font-size:0.65rem; }
.sub-btn.active { background:rgba(232,71,120,0.15); border-color:var(--accent3); color:var(--accent3); }
.time-sig-grid { display:flex; gap:6px; flex-wrap:wrap; margin-top:6px; }
.tsig-btn { padding:5px 10px; border:1px solid var(--border); background:transparent; color:var(--text-dim); border-radius:4px; cursor:pointer; font-family:'Space Mono',monospace; font-size:0.7rem; }
.tsig-btn.active { background:rgba(232,197,71,0.15); border-color:var(--accent); color:var(--accent); }

/* Tuner Styles */
.tuner-layout { display: flex; flex-direction: column; gap: 12px; max-width: 480px; margin: 0 auto; }
.a-ref-row { display: flex; align-items: center; gap: 10px; background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 10px 14px; }
.a-ref-label { font-family: 'Space Mono', monospace; font-size: 0.68rem; color: var(--text-dim); }
.tuner-note-panel { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 20px; text-align: center; }
.tuner-note-name { font-family: 'Bebas Neue', sans-serif; font-size: 5rem; line-height: 1; color: var(--accent); min-height: 5rem; }
.tuner-note-name.in-tune  { color: #44e87a; }
.tuner-note-name.no-input { color: var(--border); }
.tuner-freq-display { font-family: 'Space Mono', monospace; font-size: 0.9rem; color: var(--text-dim); margin-top: 2px; }
.cent-meter-wrap { margin: 16px auto 0; position: relative; width: 100%; max-width: 360px; }
.cent-track { position: relative; height: 12px; background: var(--panel2); border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
.cent-fill { position: absolute; top: 0; bottom: 0; width: 4px; border-radius: 2px; background: var(--accent); left: 50%; transform: translateX(-50%); transition: left 0.08s ease-out; }
.cent-fill.in-tune  { background: #44e87a; }
.cent-fill.flat     { background: var(--accent2); }
.cent-fill.sharp    { background: var(--accent3); }
.cent-center-line { position: absolute; top: -2px; bottom: -2px; left: 50%; width: 2px; background: rgba(255,255,255,0.3); transform: translateX(-50%); }
.cent-labels { display: flex; justify-content: space-between; margin-top: 4px; font-family: 'Space Mono', monospace; font-size: 0.55rem; color: var(--text-dim); }
.cent-value { text-align: center; font-family: 'Space Mono', monospace; font-size: 1rem; font-weight: 700; margin-top: 8px; min-height: 1.4rem; }
.tuner-mic-btn { width: 100%; padding: 11px; border-radius: 6px; border: 1px solid var(--accent2); background: transparent; color: var(--accent2); font-family: 'Bebas Neue', sans-serif; font-size: 1.2rem; cursor: pointer; }

.a-spin-btn { width: 36px; height: 36px; border: 1px solid var(--accent); background: transparent; color: var(--accent); font-size: 1.1rem; cursor: pointer; border-radius: 4px; font-family: 'Space Mono', monospace; }
.a-spin-display { min-width: 52px; text-align: center; font-family: 'Bebas Neue', sans-serif; font-size: 1.6rem; color: var(--accent); line-height: 36px; border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); padding: 0 6px; }

/* ── TABLET / COMPACT RESPONSIVE FIXES ── */
@media (max-width: 820px), (max-height: 760px) {
  .app { padding: 10px; }
  header { margin-bottom: 10px; padding-bottom: 8px; }
  h1 { font-size: 2.2rem; }
  .tab { height: 38px; padding: 0 10px; }
  .tab-label { font-size: 0.65rem; }
  .hd-controls { margin-bottom: 8px; }
  .ctrl-group { padding: 6px 8px; min-width: 120px; }
  .chord-display { height: 56px; min-height: 56px; max-height: 56px; margin-bottom: 8px; padding: 0 10px; }
  .chord-name { font-size: 2.3rem; width: 100px; min-width: 100px; max-width: 100px; }
  .keyboard-wrap { height: 155px; }
  .keyboard { height: 140px; }
  .key.white { height: 140px; width: 34px; }
  .key.black { height: 86px; width: 22px; }
}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand">
      <h1>HarmoniX <span class="version">v1.2</span></h1>
      <div class="subtitle">音楽ツール // Music Tool</div>
    </div>
    <!-- タブレット・PC対応：ロゴ横に設置されたナビゲーション -->
    <div class="tab-bar">
      <button class="tab active" onclick="switchTab('harmony',this)" aria-label="キーボード">
        <svg width="22" height="18" viewBox="0 0 32 22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="1" y="1" width="4" height="20" rx="1"/><rect x="6" y="1" width="4" height="20" rx="1"/><rect x="11" y="1" width="4" height="20" rx="1"/><rect x="16" y="1" width="4" height="20" rx="1"/><rect x="21" y="1" width="4" height="20" rx="1"/><rect x="26" y="1" width="4" height="20" rx="1"/><rect x="4" y="1" width="3" height="12" rx="1" fill="currentColor" stroke="none"/><rect x="9" y="1" width="3" height="12" rx="1" fill="currentColor" stroke="none"/><rect x="19" y="1" width="3" height="12" rx="1" fill="currentColor" stroke="none"/><rect x="24" y="1" width="3" height="12" rx="1" fill="currentColor" stroke="none"/></svg>
        <span class="tab-label">キーボード</span>
      </button>
      <button class="tab" onclick="switchTab('metro',this)" aria-label="メトロノーム">
        <svg class="tab-icon-metro" width="18" height="20" viewBox="0 0 26 28" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><polygon points="5,27 21,27 18,4 8,4"/><line x1="13" y1="22" x2="18" y2="8"/><circle cx="18.5" cy="7.5" r="2" fill="currentColor" stroke="none"/><line x1="3" y1="27" x2="23" y2="27"/><line x1="13" y1="22" x2="13" y2="25"/></svg>
        <span class="tab-label">メトロノーム</span>
      </button>
      <button class="tab" onclick="switchTab('tuner',this)" aria-label="チューナー">
        <svg width="18" height="20" viewBox="0 0 24 28" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><line x1="9" y1="4" x2="9" y2="18"/><line x1="15" y1="4" x2="15" y2="18"/><path d="M9,4 Q9,1 12,1 Q15,1 15,4"/><line x1="12" y1="18" x2="12" y2="27"/><line x1="9.5" y1="23" x2="14.5" y2="23"/></svg>
        <span class="tab-label">チューナー</span>
      </button>
    </div>
  </header>

  <div id="panel-harmony" class="panel active">
    <div class="hd-controls">
      <div class="ctrl-group">
        <div class="ctrl-label">チューニング</div>
        <div class="toggle-row">
          <button class="toggle-btn active" id="btn-equal" onclick="setTuning('equal')">平均律</button>
          <button class="toggle-btn" id="btn-just" onclick="setTuning('just')">純正律</button>
        </div>
        <div class="toggle-row" id="autoroot-row" style="margin-top:2px; display:none;">
          <button class="toggle-btn active" id="btn-autoroot-on" onclick="setAutoRoot(true)">根音自動</button>
          <button class="toggle-btn" id="btn-autoroot-off" onclick="setAutoRoot(false)">C固定</button>
        </div>
      </div>
      <div class="ctrl-group">
        <div class="ctrl-label">音色</div>
        <div class="toggle-row">
          <button class="toggle-btn active" id="btn-sine" onclick="setTimbre('sine')">シンプル</button>
          <button class="toggle-btn" id="btn-wind" onclick="setTimbre('wind')">管楽器</button>
        </div>
      </div>
      <div class="ctrl-group">
        <div class="ctrl-label">音量</div>
        <input type="range" class="vol-slider" min="0" max="1" step="0.01" value="0.5" oninput="setVolume(this.value)" style="margin-top:4px;">
      </div>
      <div class="ctrl-group" style="min-width:130px;">
        <div class="ctrl-label">基準音 A</div>
        <div style="display:flex;align-items:center;gap:0;margin-top:2px;">
          <button class="a-spin-btn" onclick="setA4(tunerA4-1)">−</button>
          <div class="a-spin-display" id="a4-display-harmony">442</div>
          <button class="a-spin-btn" onclick="setA4(tunerA4+1)">＋</button>
        </div>
      </div>
    </div>

    <div class="chord-display">
      <div class="chord-name no-chord" id="chord-name">—</div>
      <div class="chord-info">
        <div class="chord-type" id="chord-type">鍵盤を押してください</div>
        <div class="active-notes" id="active-notes-display"></div>
      </div>
      <div class="tuning-badge" id="tuning-badge">平均律</div>
    </div>

    <div class="octave-nav">
      <button class="oct-btn prev" id="oct-prev" onclick="shiftOctave(-1)">◀ 1oct下</button>
      <div class="oct-range-label" id="oct-range-label">C3 〜 B5</div>
      <button class="oct-btn next" id="oct-next" onclick="shiftOctave(+1)">1oct上 ▶</button>
    </div>
    <div class="keyboard-wrap"><div class="keyboard" id="keyboard"></div></div>
  </div>

  <div id="panel-metro" class="panel">
    <div class="metro-layout">
      <div class="metro-panel">
        <div class="metro-display">
          <div class="bpm-number" id="bpm-display">120</div><div class="bpm-unit">BPM</div>
        </div>
        <input type="range" class="bpm-slider" id="bpm-slider" min="40" max="240" value="120" oninput="setBPM(parseInt(this.value))">
        <button class="metro-btn start" id="metro-start" onclick="toggleMetro()">▶ スタート</button>
        <button class="metro-btn tap" onclick="tapTempo()">TAP TEMPO</button>
      </div>
      <div class="metro-panel">
        <div class="section-title">拍子</div>
        <div class="time-sig-grid">
          <button class="tsig-btn active" onclick="setTimeSig(4,this)">4/4</button>
          <button class="tsig-btn" onclick="setTimeSig(3,this)">3/4</button>
          <button class="tsig-btn" onclick="setTimeSig(2,this)">2/4</button>
          <button class="tsig-btn" onclick="setTimeSig(6,this)">6/8</button>
        </div>
        <div class="sub-ctrl">
          <div class="sub-label">サブディビジョン</div>
          <div class="sub-grid">
            <button class="sub-btn active" onclick="setSubDiv('none',this)">なし</button>
            <button class="sub-btn" onclick="setSubDiv('8th',this)">8分</button>
            <button class="sub-btn" onclick="setSubDiv('16th',this)">16分</button>
            <button class="sub-btn" onclick="setSubDiv('triplet',this)">3連符</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div id="panel-tuner" class="panel">
    <div class="tuner-layout">
      <div class="a-ref-row">
        <div class="a-ref-label">基準音 A =</div>
        <div style="display:flex;align-items:center;flex:1;justify-content:center;">
          <button class="a-spin-btn" onclick="setA4(tunerA4-1)">−</button>
          <div class="a-spin-display" id="a4-display">442</div>
          <button class="a-spin-btn" onclick="setA4(tunerA4+1)">＋</button>
          <span style="font-family:'Space Mono';font-size:0.7rem;color:var(--text-dim);margin-left:6px;">Hz</span>
        </div>
      </div>
      <div class="tuner-note-panel">
        <div class="tuner-note-name no-input" id="tuner-note">—</div>
        <div class="tuner-freq-display" id="tuner-freq"></div>
        <div class="cent-meter-wrap">
          <div class="cent-track"><div class="cent-center-line"></div><div class="cent-fill" id="cent-fill"></div></div>
          <div class="cent-labels"><span>−50¢</span><span>0</span><span>+50¢</span></div>
          <div class="cent-value" id="cent-value"></div>
        </div>
      </div>
      <button class="tuner-mic-btn" id="tuner-mic-btn" onclick="toggleTuner()">マイクをオンにする</button>
    </div>
  </div>
</div>

<script>
'use strict';
const AC = new (window.AudioContext || window.webkitAudioContext)();
const masterGain = AC.createGain(); masterGain.gain.value = 0.5; masterGain.connect(AC.destination);

function setVolume(v) { masterGain.gain.value = parseFloat(v); }

let tuning = 'equal';
let timbre = 'sine';
let A4_FREQ = 442;
let autoRoot = true;

const JUST = [1, 16/15, 9/8, 6/5, 5/4, 4/3, 45/32, 3/2, 8/5, 5/3, 9/5, 15/8];
const activeOscs = {};
const pressedNotes = new Set();

function playNote(semitone) {
  if (activeOscs[semitone]) return;
  AC.resume();
  
  const now = AC.currentTime;
  const gainNode = AC.createGain();
  
  /* 
   * 【アタック音の改善処理】
   *  0.0001から指数関数(exponentialRamp)で滑らかに立ち上げることで
   *  シンプルモード（正弦波）での突発的なクリックノイズ（プチ音）を完全に解消
   */
  gainNode.gain.setValueAtTime(0.0001, now);

  const filter = AC.createBiquadFilter();
  filter.type = 'lowpass';

  const oscList = [];

  if (timbre === 'sine') {
    // シンプルモード：12msのマイクロアタックでクリアな発音
    gainNode.gain.exponentialRampToValueAtTime(0.2, now + 0.012);
    filter.frequency.setValueAtTime(2200, now);

    const o = AC.createOscillator();
    o.type = 'sine';
    o.connect(filter);
    oscList.push({ osc: o, mult: 1 });
  } else {
    // 管楽器モード：自然な吹奏感のアタック（30ms）
    gainNode.gain.exponentialRampToValueAtTime(0.2, now + 0.030);
    filter.frequency.setValueAtTime(1600, now);

    const harmonics = [
      { mult: 1, gain: 0.65 },
      { mult: 2, gain: 0.18 },
      { mult: 3, gain: 0.08 },
      { mult: 4, gain: 0.03 }
    ];

    harmonics.forEach(h => {
      const o = AC.createOscillator();
      o.type = 'sine';
      const g = AC.createGain();
      g.gain.value = h.gain;
      o.connect(g);
      g.connect(filter);
      oscList.push({ osc: o, mult: h.mult });
    });
  }

  filter.connect(gainNode);
  gainNode.connect(masterGain);

  oscList.forEach(item => item.osc.start(now));
  activeOscs[semitone] = { oscList, gainNode };
  tuneActiveNotes();
}

function stopNote(semitone) {
  if (!activeOscs[semitone]) return;
  const { oscList, gainNode } = activeOscs[semitone];
  const t = AC.currentTime;
  gainNode.gain.cancelScheduledValues(t);
  const currentGain = Math.max(gainNode.gain.value, 0.0001);
  gainNode.gain.setValueAtTime(currentGain, t);
  gainNode.gain.exponentialRampToValueAtTime(0.0001, t + 0.08); 
  oscList.forEach(item => { try { item.osc.stop(t + 0.1); } catch(e){} });
  delete activeOscs[semitone];
  
  setTimeout(() => { if(Object.keys(activeOscs).length > 0) tuneActiveNotes(); }, 10);
}

function tuneActiveNotes() {
  const pressed = [...pressedNotes].sort((a,b)=>a-b);
  let rootSemitone = pressed.length > 0 ? pressed[0] : null;

  if (pressed.length > 0 && autoRoot && tuning === 'just') {
    const pcs = [...new Set(pressed.map(s => ((s%12)+12)%12))].sort((a,b)=>a-b);
    let best = null;
    for (const root of pcs) {
      const ivs = pcs.map(n => ((n-root)+12)%12).sort((a,b)=>a-b);
      for (const ct of CHORD_TYPES) {
        const ci = ct.iv.map(i=>i%12).sort((a,b)=>a-b);
        if (ivs.length===ci.length && ivs.every((v,i)=>v===ci[i])) { best={root,ct}; break; }
      }
      if (best) break;
    }
    if (best) {
      const found = pressed.find(s => ((s%12)+12)%12 === best.root);
      if (found !== undefined) rootSemitone = found;
    }
  }

  const t = AC.currentTime;
  const rootEqualFreq = rootSemitone !== null ? (A4_FREQ * Math.pow(2, (rootSemitone - 9) / 12)) : A4_FREQ;

  for (const semitone in activeOscs) {
    const s = parseInt(semitone);
    let freq;
    if (tuning === 'equal' || rootSemitone === null || !autoRoot) {
      freq = A4_FREQ * Math.pow(2, (s - 9) / 12);
    } else {
      const diff = s - rootSemitone;
      const octShift = Math.floor(diff / 12);
      const degree = ((diff % 12) + 12) % 12;
      freq = rootEqualFreq * Math.pow(2, octShift) * JUST[degree];
    }
    activeOscs[semitone].oscList.forEach(item => {
      item.osc.frequency.setTargetAtTime(freq * item.mult, t, 0.02);
    });
  }
}

function startNote(s) {
  if (pressedNotes.has(s)) return;
  pressedNotes.add(s); playNote(s);
  document.querySelectorAll(`.key[data-semitone="${s}"]`).forEach(k => k.classList.add('pressed'));
  updateChord();
}

function endNote(s) {
  if (!pressedNotes.has(s)) return;
  pressedNotes.delete(s); stopNote(s);
  document.querySelectorAll(`.key[data-semitone="${s}"]`).forEach(k => k.classList.remove('pressed'));
  updateChord();
}

const CHORD_TYPES = [
  {name:'',iv:[0,4,7],label:'メジャー'}, {name:'m',iv:[0,3,7],label:'マイナー'},
  {name:'7',iv:[0,4,7,10],label:'ドミナント7th'}, {name:'M7',iv:[0,4,7,11],label:'メジャー7th'},
  {name:'m7',iv:[0,3,7,10],label:'マイナー7th'}, {name:'dim',iv:[0,3,6],label:'ディミニッシュ'},
  {name:'sus4',iv:[0,5,7],label:'サスフォー'}
];
const NOTE_NAMES = ['C','D♭','D','E♭','E','F','G♭','G','A♭','A','B♭','B'];
const WHITE_DEG = [0,2,4,5,7,9,11];
const BLACK_AFTER = [1,3,null,6,8,10,null];

let OCT_SPAN = 3, octLo = 3;
const OCT_MIN = 1, OCT_MAX = 7, KW = 38, KG = 2, KB_W = 24;

function octHi() { return octLo + OCT_SPAN - 1; }
function shiftOctave(delta) {
  const newLo = octLo + delta;
  if (newLo < OCT_MIN || newLo + OCT_SPAN - 1 > OCT_MAX) return;
  [...pressedNotes].forEach(s => endNote(s));
  octLo = newLo; buildKeyboard(); updateOctaveNav();
}
function updateOctaveNav() {
  document.getElementById('oct-range-label').textContent = `C${octLo} 〜 B${octHi()}`;
  document.getElementById('oct-prev').disabled = (octLo <= OCT_MIN);
  document.getElementById('oct-next').disabled = (octHi() >= OCT_MAX);
}
function buildKeyboard() {
  const kb = document.getElementById('keyboard');
  if (!kb) return;
  kb.innerHTML = '';
  let wi = 0;
  for (let oct = octLo; oct <= octHi(); oct++) {
    for (let pos = 0; pos < WHITE_DEG.length; pos++) {
      const degree = WHITE_DEG[pos], semitone = (oct - 4) * 12 + degree;
      const wk = document.createElement('div');
      wk.className = 'key white'; wk.dataset.semitone = semitone;
      wk.style.left = (wi * (KW + KG)) + 'px';
      if (degree === 0) { const lbl = document.createElement('div'); lbl.className = 'key-label'; lbl.textContent = 'C' + oct; wk.appendChild(lbl); }
      addKeyEvents(wk, semitone); kb.appendChild(wk);
      const bd = BLACK_AFTER[pos];
      if (bd !== null) {
        const bs = (oct - 4) * 12 + bd;
        const bk = document.createElement('div'); bk.className = 'key black'; bk.dataset.semitone = bs;
        bk.style.left = (wi * (KW + KG) + KW - KB_W / 2 + KG / 2) + 'px';
        addKeyEvents(bk, bs); kb.appendChild(bk);
      }
      wi++;
    }
  }
  kb.style.width = (wi * (KW + KG)) + 'px';
}
function addKeyEvents(el, semitone) {
  el.addEventListener('mousedown', e => { e.preventDefault(); startNote(semitone); });
  el.addEventListener('mouseup', ()=> endNote(semitone));
  el.addEventListener('mouseleave', ()=> { if (el.classList.contains('pressed')) endNote(semitone); });
  el.addEventListener('touchstart', e => { e.preventDefault(); startNote(semitone); }, {passive:false});
  el.addEventListener('touchend', e => { e.preventDefault(); endNote(semitone); });
}

function updateChord() {
  const nameEl = document.getElementById('chord-name');
  const typeEl = document.getElementById('chord-type');
  const notesEl = document.getElementById('active-notes-display');
  const pressed = [...pressedNotes].sort((a,b)=>a-b);
  
  notesEl.innerHTML = pressed.map(s => `<span class="note-pill">${NOTE_NAMES[((s%12)+12)%12]}${Math.floor(s/12) + 4}</span>`).join('');
  const pcs = [...new Set(pressed.map(s => ((s%12)+12)%12))].sort((a,b)=>a-b);

  if (pcs.length === 0) {
    nameEl.textContent = '—'; nameEl.className = 'chord-name no-chord';
    typeEl.textContent = '鍵盤を押してください'; return;
  }
  if (pcs.length === 1) {
    nameEl.textContent = NOTE_NAMES[pcs[0]]; nameEl.className = 'chord-name';
    typeEl.textContent = '単音'; return;
  }
  let best = null;
  for (const root of pcs) {
    const ivs = pcs.map(n => ((n-root)+12)%12).sort((a,b)=>a-b);
    for (const ct of CHORD_TYPES) {
      const ci = ct.iv.map(i=>i%12).sort((a,b)=>a-b);
      if (ivs.length===ci.length && ivs.every((v,i)=>v===ci[i])) { best={root,ct}; break; }
    }
    if (best) break;
  }
  if (best) {
    nameEl.textContent = NOTE_NAMES[best.root] + best.ct.name;
    nameEl.className = 'chord-name'; typeEl.textContent = best.ct.label;
  } else {
    nameEl.textContent = '?'; nameEl.className = 'chord-name'; typeEl.textContent = '不明なコード';
  }
}

function setTuning(t) {
  tuning = t;
  document.getElementById('btn-equal').classList.toggle('active', t==='equal');
  document.getElementById('btn-just').classList.toggle('active',  t==='just');
  document.getElementById('autoroot-row').style.display = (t === 'just') ? 'flex' : 'none';
  document.getElementById('tuning-badge').textContent = t==='equal' ? '平均律' : (autoRoot ? '純正律(自動)' : '純正律(C固定)');
  tuneActiveNotes();
}

function setAutoRoot(val) {
  autoRoot = val;
  document.getElementById('btn-autoroot-on').classList.toggle('active', val);
  document.getElementById('btn-autoroot-off').classList.toggle('active', !val);
  document.getElementById('tuning-badge').textContent = autoRoot ? '純正律(自動)' : '純正律(C固定)';
  tuneActiveNotes();
}

function setTimbre(t) {
  timbre = t;
  document.getElementById('btn-sine').classList.toggle('active', t==='sine');
  document.getElementById('btn-wind').classList.toggle('active', t==='wind');
  [...pressedNotes].forEach(s=>{stopNote(s);playNote(s);});
}

let tunerA4 = 442;
function setA4(hz) {
  tunerA4 = A4_FREQ = Math.max(415, Math.min(470, parseInt(hz)));
  if(document.getElementById('a4-display')) document.getElementById('a4-display').textContent = hz;
  if(document.getElementById('a4-display-harmony')) document.getElementById('a4-display-harmony').textContent = hz;
  tuneActiveNotes();
}

function switchTab(name, el) {
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.getElementById('panel-'+name).classList.add('active');
  el.classList.add('active');
}

window.addEventListener('DOMContentLoaded', () => {
  buildKeyboard();
  updateOctaveNav();
  setA4(442);
});
</script>
</body>
</html>
